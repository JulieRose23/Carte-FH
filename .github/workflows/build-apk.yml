name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/
          cp -r lib www/
          sed -i 's|data/|https://raw.githubusercontent.com/JulieRose23/Carte-FH/main/data/|g' www/index.html

      - name: Build Signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Carte-FH" "io.github.julierose23.cartefh" --web-dir=www
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" /><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" /><application|' android/app/src/main/AndroidManifest.xml
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/carte-fh.keystore
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("carte-fh.keystore")
                      storePassword "cartefh2026"
                      keyAlias "cartefh"
                      keyPassword "cartefh2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF
          cd android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Carte-FH.apk

      - name: Publier la Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Carte-FH v1.0.${{ github.run_number }}
          files: Carte-FH.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
