<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Carte des Faisceaux Hertziens (ANFR)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .control-panel {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.16);
      padding: 16px 18px;
      width: 270px;
      color: #1e293b;
      transition: all 0.2s ease;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      color: #0f172a;
    }
    .mobile-toggle {
      display: none;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .section-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #64748b;
      text-transform: uppercase;
      margin: 12px 0 6px;
    }
    select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 13.5px;
      color: #1e293b;
      outline: none;
    }
    .op-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .op-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    .op-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
      cursor: pointer;
      margin: 0;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .status-bar {
      margin-top: 10px;
      font-size: 11.5px;
      color: #64748b;
      min-height: 16px;
    }

    /* Infobulles */
    .leaflet-popup-content {
      margin: 12px 14px;
      font-size: 13px;
      line-height: 1.45;
      color: #1e293b;
      min-width: 240px;
    }
    .popup-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
      color: #0f172a;
    }
    .popup-fh-list {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #e2e8f0;
      max-height: 140px;
      overflow-y: auto;
      font-size: 12.5px;
    }
    .popup-fh-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      gap: 10px;
    }

    /* Adaptation spécifique MOBILE uniquement (sans impact sur PC) */
    @media (max-width: 768px) {
      .control-panel {
        top: 10px;
        right: 10px;
        left: 54px;
        width: auto;
        padding: 10px 12px;
        border-radius: 10px;
      }
      .panel-header {
        margin-bottom: 0;
      }
      .panel-title {
        font-size: 14px;
      }
      .mobile-toggle {
        display: inline-block;
      }
      .panel-body {
        display: none;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #e2e8f0;
        max-height: 65vh;
        overflow-y: auto;
      }
      .control-panel.open .panel-body {
        display: block;
      }
      .op-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 10px;
      }
      .op-item {
        font-size: 13px;
      }
      .leaflet-popup-content {
        min-width: 200px;
        max-width: 260px;
        font-size: 12.5px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="control-panel" id="controlPanel">
    <div class="panel-header">
      <h1 class="panel-title">Faisceaux Hertziens</h1>
      <button class="mobile-toggle" id="mobileToggle" type="button">Filtres ▼</button>
    </div>

    <div class="panel-body">
      <label class="section-label" for="archiveSelect">Archive ANFR</label>
      <select id="archiveSelect"></select>

      <span class="section-label">Opérateurs</span>
      <div class="op-list">
        <label class="op-item"><input type="checkbox" value="orange" /><span class="dot" style="background:#ff7900"></span>Orange</label>
        <label class="op-item"><input type="checkbox" value="sfr" /><span class="dot" style="background:#e2001a"></span>SFR</label>
        <label class="op-item"><input type="checkbox" value="bouygues" /><span class="dot" style="background:#009dcc"></span>Bouygues Telecom</label>
        <label class="op-item"><input type="checkbox" value="free" /><span class="dot" style="background:#cd1e25"></span>Free Mobile</label>
        <label class="op-item"><input type="checkbox" value="autres" /><span class="dot" style="background:#64748b"></span>Autres (TDF, etc.)</label>
      </div>

      <label class="section-label" for="bandeSelect">Bande de fréquence</label>
      <select id="bandeSelect">
        <option value="all">Toutes les fréquences</option>
        <option value="moins_10">&lt; 10 GHz (6 - 8 GHz)</option>
        <option value="11_15">11 - 15 GHz</option>
        <option value="18">18 GHz</option>
        <option value="23_26">23 - 26 GHz</option>
        <option value="32_38">32 - 38 GHz</option>
        <option value="70_80">70 - 80 GHz (E-Band)</option>
      </select>

      <div class="status-bar" id="statusBar"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const COULEURS = {
      orange: "#ff7900",
      sfr: "#e2001a",
      bouygues: "#009dcc",
      free: "#cd1e25",
      autres: "#64748b"
    };

    const NOMS_OP = {
      orange: "ORANGE",
      sfr: "SFR",
      bouygues: "BOUYGUES TELECOM",
      free: "FREE MOBILE",
      autres: "AUTRES"
    };

    const map = L.map("map", {
      center: [46.7, 2.5],
      zoom: 6,
      preferCanvas: true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap | Données ANFR'
    }).addTo(map);

    const layersCache = {};
    const activeLayers = {};
    let currentArchive = "";
    let currentBand = "all";

    const archiveSelect = document.getElementById("archiveSelect");
    const bandeSelect = document.getElementById("bandeSelect");
    const statusBar = document.getElementById("statusBar");
    const controlPanel = document.getElementById("controlPanel");
    const mobileToggle = document.getElementById("mobileToggle");

    mobileToggle.addEventListener("click", () => {
      const isOpen = controlPanel.classList.toggle("open");
      mobileToggle.textContent = isOpen ? "Fermer ▲" : "Filtres ▼";
    });

    function buildPopupSite(p) {
      const fhs = (p.fhs || []).filter(f => currentBand === "all" || f.b === currentBand);
      const lignes = fhs.map(f =>
        `<div class="popup-fh-row"><span>${f.az}° &rarr; #${f.to}</span><span><b>${f.f} GHz</b> &bull; ${f.d} km</span></div>`
      ).join("");

      return `
        <div class="popup-title">Site Support #${p.sid} (${NOMS_OP[p.op] || p.op})</div>
        <div><b>Lieu :</b> ${p.adr}</div>
        <div><b>Station ANFR :</b> ${p.sta} | <b>Hauteur :</b> ${p.hs} m</div>
        <div><b>Implantation :</b> ${p.di} | <b>Modif :</b> ${p.dm}</div>
        <div><b>Mise en service :</b> ${p.ds}</div>
        <div class="popup-fh-list">
          <b>Faisceaux (${fhs.length}) :</b>
          ${lignes || "<div>Aucun faisceau dans cette bande</div>"}
        </div>
      `;
    }

    function buildPopupLink(p) {
      return `
        <div class="popup-title">Liaison FH (${NOMS_OP[p.op] || p.op})</div>
        <div><b>Fréquence :</b> ${p.f} GHz</div>
        <div><b>Distance :</b> ${p.d} km | <b>Azimut :</b> ${p.az}°</div>
        <div><b>Hauteurs antennes :</b> ${p.h}</div>
        <div><b>Supports :</b> #${p.s1} &harr; #${p.s2}</div>
      `;
    }

    function createGeoJsonLayer(geojson, op) {
      const color = COULEURS[op] || "#334155";
      return L.geoJSON(geojson, {
        filter: (feature) => {
          if (currentBand === "all") return true;
          const props = feature.properties;
          if (props.kind === "link") return props.b === currentBand;
          if (props.kind === "site") return Array.isArray(props.bs) && props.bs.includes(currentBand);
          return true;
        },
        style: () => ({
          color: color,
          weight: 2.2,
          opacity: 0.85
        }),
        pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
          radius: 5,
          fillColor: color,
          color: "#ffffff",
          weight: 1.5,
          fillOpacity: 0.95
        }),
        onEachFeature: (feature, layer) => {
          layer.on("click", () => {
            const p = feature.properties;
            const html = p.kind === "site" ? buildPopupSite(p) : buildPopupLink(p);
            layer.bindPopup(html).openPopup();
          });
        }
      });
    }

    async function toggleOperator(op, checked) {
      if (activeLayers[op]) {
        map.removeLayer(activeLayers[op]);
        delete activeLayers[op];
      }
      if (!checked || !currentArchive) return;

      const cacheKey = `${currentArchive}_${op}`;
      try {
        statusBar.textContent = `Chargement ${NOMS_OP[op]}...`;
        if (!layersCache[cacheKey]) {
          const resp = await fetch(`data/${currentArchive}/fh_${op}.geojson`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          layersCache[cacheKey] = await resp.json();
        }
        const layer = createGeoJsonLayer(layersCache[cacheKey], op);
        layer.addTo(map);
        activeLayers[op] = layer;
        statusBar.textContent = "";
      } catch (err) {
        statusBar.textContent = `Erreur chargement ${NOMS_OP[op]}`;
      }
    }

    async function refreshActiveOperators() {
      const checkboxes = document.querySelectorAll('.op-list input[type="checkbox"]');
      for (const cb of checkboxes) {
        await toggleOperator(cb.value, cb.checked);
      }
    }

    document.querySelectorAll('.op-list input[type="checkbox"]').forEach(cb => {
      cb.addEventListener("change", (e) => toggleOperator(e.target.value, e.target.checked));
    });

    bandeSelect.addEventListener("change", (e) => {
      currentBand = e.target.value;
      refreshActiveOperators();
    });

    archiveSelect.addEventListener("change", (e) => {
      currentArchive = e.target.value;
      refreshActiveOperators();
    });

    async function init() {
      try {
        const resp = await fetch("data/archives.json");
        const archives = await resp.json();
        archiveSelect.innerHTML = archives.map(a => `<option value="${a.id}">${a.label}</option>`).join("");
        if (archives.length > 0) {
          currentArchive = archives[0].id;
          await refreshActiveOperators();
        }
      } catch (err) {
        statusBar.textContent = "Impossible de charger data/archives.json";
      }
    }

    init();
  </script>
</body>
</html>
